<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de bodas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<style>
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  /* Evita el scroll/desbordamiento horizontal accidental (clip no rompe position:sticky) */
  body { overflow-x: clip; }
  /* Escritorio: rail vertical estrecho, solo iconos, a la izquierda */
  .nav { position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; width: 74px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    background: var(--color-surface); border-right: 1px solid var(--color-divider);
    padding: var(--space-5) 0 var(--space-4); overflow: visible; }
  .nav-brand { display: flex; margin: 0 0 var(--space-5); }
  .nav-brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 13px;
    background: color-mix(in srgb, var(--color-accent) 14%, var(--color-surface)); color: var(--color-accent-700); }
  .nav-brand-mark svg { width: 23px; height: 23px; }
  .nav-brand-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Rótulo = prolongación del propio icono hacia la derecha: mismo color
     (terracota del icono activo) y unido al botón, sin caret ni deslizamiento.
     Oculto por opacidad → sigue leído por los lectores de pantalla. */
  .nav-lb, .act-lb {
    position: absolute; left: 100%; top: 0; height: 100%;
    display: inline-flex; align-items: center; padding: 0 18px 0 3px;
    white-space: nowrap; pointer-events: none; z-index: 40;
    background: var(--color-accent-100);
    color: var(--color-accent-700); border-radius: 0 14px 14px 0;
    box-shadow: 9px 0 20px -10px color-mix(in srgb, var(--color-accent) 55%, transparent);
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600; letter-spacing: .02em; line-height: 1;
    opacity: 0; clip-path: inset(0 100% 0 0 round 0 14px 14px 0);
    transition: opacity .15s ease, clip-path .26s cubic-bezier(.22,.61,.36,1); }
  .nav-links button:hover .nav-lb, .nav-links button:focus-visible .nav-lb,
  .nav-actions button:hover .act-lb, .nav-actions button:focus-visible .act-lb {
    opacity: 1; clip-path: inset(0 0 0 0 round 0 14px 14px 0); }
  .nav-toggle { display: none; }
  .nav-panel { display: flex; flex-direction: column; align-items: center; flex: 1; gap: var(--space-5); }
  .nav-links { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-links button { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0;
    border: 0; background: transparent; cursor: pointer; color: var(--color-text); border-radius: 14px;
    transition: background .15s ease, box-shadow .2s ease; }
  .nav-links button:hover, .nav-links button:focus-visible { background: var(--color-accent-100); border-radius: 14px 0 0 14px;
    box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--color-accent) 55%, transparent); }
  .nav-links button[aria-current="page"] { background: var(--color-accent-100); }
  .nav-links button[aria-current="page"]:hover, .nav-links button[aria-current="page"]:focus-visible { border-radius: 14px 0 0 14px; }
  .nav-ic { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; color: var(--color-neutral-600);
    transition: color .15s ease; }
  .nav-links button:hover .nav-ic, .nav-links button[aria-current="page"] .nav-ic { color: var(--color-accent-700); }
  .nav-ic svg { width: 21px; height: 21px; }
  .nav-actions { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .nav-actions button { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0;
    border: 0; background: transparent; cursor: pointer; border-radius: 14px; color: var(--color-neutral-600);
    transition: background .15s ease, box-shadow .2s ease, color .15s ease; }
  .nav-actions button:hover, .nav-actions button:focus-visible { background: var(--color-accent-100); border-radius: 14px 0 0 14px; color: var(--color-accent-700);
    box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--color-accent) 55%, transparent); }
  .act-ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
  .act-ic svg { width: 19px; height: 19px; }
  /* Hamburguesa (solo móvil) */
  .nav-toggle-bars, .nav-toggle-bars::before, .nav-toggle-bars::after {
    content: ''; display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--color-text); transition: transform .2s ease, opacity .2s ease; }
  .nav-toggle-bars { position: relative; }
  .nav-toggle-bars::before { position: absolute; top: -6px; }
  .nav-toggle-bars::after { position: absolute; top: 6px; }
  .nav.is-open .nav-toggle-bars { background: transparent; }
  .nav.is-open .nav-toggle-bars::before { transform: translateY(6px) rotate(45deg); }
  .nav.is-open .nav-toggle-bars::after { transform: translateY(-6px) rotate(-45deg); }
  .nav-links button:focus-visible, .nav-actions button:focus-visible, .nav-toggle:focus-visible, .skip:focus-visible {
    outline: 2px solid var(--color-accent); outline-offset: 2px; }
  main.content { margin-left: 74px; padding: var(--space-6) var(--space-8); }
  main.content:focus { outline: none; }
  .view { display: none; }
  .view.active { display: block; }
  /* Móvil/tablet pequeña: barra superior + menú hamburguesa (con rótulos) */
  @media (max-width: 760px) {
    .nav { position: sticky; top: 0; left: auto; bottom: auto; width: auto;
      flex-direction: row; align-items: center; flex-wrap: wrap; gap: var(--space-3);
      border-right: 0; border-bottom: 1px solid var(--color-divider);
      padding: var(--space-3) var(--space-4); overflow: visible; }
    .nav-brand { margin: 0 auto 0 0; }
    .nav-brand-mark { display: none; }
    .nav-brand-txt { position: static; width: auto; height: auto; clip: auto; font-family: var(--font-heading); font-weight: 600; font-size: 18px; }
    .nav-toggle { display: inline-flex; width: 42px; height: 42px; border: 1px solid var(--color-divider); border-radius: 12px;
      background: var(--color-surface); cursor: pointer; align-items: center; justify-content: center; }
    .nav-panel { display: none; flex-basis: 100%; flex-direction: column; align-items: stretch; gap: var(--space-2);
      margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-divider); }
    .nav.is-open .nav-panel { display: flex; }
    .nav-links { align-items: stretch; gap: 2px; }
    .nav-links button { width: 100%; height: auto; min-height: 46px; justify-content: flex-start; gap: 11px; padding: 0 12px; border-radius: 10px; font-size: 15px; }
    .nav-actions { flex-direction: row; align-items: center; gap: var(--space-3); width: 100%; margin-top: 0; }
    .nav-actions button { flex: 1; width: auto; height: auto; min-height: 44px; gap: 8px; padding: 0 14px; border-radius: 10px; font-size: 13px;
      border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); }
    .nav-actions button:hover, .nav-actions button:focus-visible { border-radius: 10px; background: var(--color-surface); box-shadow: none; }
    /* Rótulos como texto inline (no tooltip) en el menú desplegable */
    .nav-lb, .act-lb { position: static; height: auto; transform: none; clip-path: none; left: auto; top: auto; opacity: 1;
      background: none; color: inherit; padding: 0; border-radius: 0; box-shadow: none; letter-spacing: normal;
      font-size: inherit; font-weight: 400; z-index: auto; pointer-events: auto; }
    .nav-links button:hover, .nav-links button:focus-visible { border-radius: 10px; box-shadow: none; }
    main.content { margin-left: 0; padding: var(--space-4) var(--space-3); }
  }
  /* Enlace para saltar al contenido (teclado/lectores de pantalla) */
  .skip { position: absolute; left: -9999px; top: 8px; z-index: 40; padding: 8px 14px; border-radius: 8px;
    background: var(--color-accent); color: var(--color-surface); text-decoration: none; font-size: 13px; }
  .skip:focus { left: 8px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <a class="skip" href="#content" data-i18n="chrome.skip">Saltar al contenido</a>
  <nav class="nav" aria-label="Principal">
    <span class="nav-brand" id="brand">
      <span class="nav-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9.3" cy="13.2" r="4.7"/><circle cx="15" cy="10.6" r="4.7"/></svg></span>
      <span class="nav-brand-txt" data-i18n="app.brand">Nuestra boda</span>
    </span>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="nav-panel">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
    <div class="nav-panel" id="nav-panel">
      <div class="nav-links" id="nav"></div>
      <div class="nav-actions">
        <button id="theme" type="button"><span class="act-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></span><span class="act-lb" data-i18n="chrome.theme">Tema</span></button>
        <button id="lang" type="button"><span class="act-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.2"/><path d="M3.9 12h16.2M12 3.8c2.3 2.3 2.3 13.8 0 16.4M12 3.8c-2.3 2.3-2.3 13.8 0 16.4"/></svg></span><span class="act-lb" data-i18n="chrome.lang">ES / EN</span></button>
      </div>
    </div>
  </nav>

  <main class="content" id="content" tabindex="-1">
    <finca-view class="view" id="view-finca"></finca-view>
    <invitados-view class="view" id="view-invitados"></invitados-view>
    <salon-view class="view" id="view-salon"></salon-view>
    <proveedores-view class="view" id="view-proveedores"></proveedores-view>
    <presupuesto-view class="view" id="view-presupuesto"></presupuesto-view>
    <timing-view class="view" id="view-timing"></timing-view>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
